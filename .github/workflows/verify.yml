name: verify

# Runs off the LogiRoot estate, with no credentials: every record is verified from the public key
# directory alone. The planted-wrong step proves the verifier can fail; the watchdog step proves the
# publisher is alive, and fails aloud when the newest record is older than two intervals. A green run
# whose controls cannot go red would be decoration.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The records live on the append-only records branch; the verifier and its controls run from main.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: records
          path: witness-records
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install --quiet dilithium-py pytest
      - name: The verifier's own controls hold (schema rules, c1 digest, refusals)
        run: python -m pytest verify -q
      - name: Every published record verifies from the public key directory
        run: python verify/verify.py --root witness-records
      - name: CONTROL, a planted-wrong record must fail
        run: |
          set -e
          scratch=$(python verify/plant.py witness-records)
          if python verify/verify.py --root "$scratch"; then
            echo "::error::the planted-wrong record PASSED; the verifier cannot fail"; exit 1
          fi
          echo "control held: the planted-wrong record failed verification"
      - name: WATCHDOG, the publisher is alive (newest record younger than two hourly intervals)
        run: python verify/watchdog.py witness-records --max-age-seconds 7200
      - name: CONTROL, the watchdog can fail (a clock a day ahead must read STALE)
        run: |
          set -e
          if python verify/watchdog.py witness-records --max-age-seconds 7200 --now "$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%S+00:00)"; then
            echo "::error::the watchdog PASSED a day-old record; it cannot fail"; exit 1
          fi
          echo "control held: the watchdog fails a stale record"
